<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的3D小屋</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
  #ui { position: fixed; top: 12px; left: 12px; color: #fff; font-family: sans-serif; font-size: 13px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 8px; z-index: 10; pointer-events: none; line-height: 1.5;}
  #joystick { position: fixed; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.2); border-radius: 50%; z-index: 10; border: 2px solid rgba(255,255,255,0.5); }
  #stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <b>操作说明：</b><br>
  左下滑动：走路<br>
  右半屏滑动：转头看四周
</div>
<div id="joystick"><div id="stick"></div></div>

<script src="https://cdn.staticfile.org/three.js/0.160.0/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 10, 50);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(50, 32),
  new THREE.MeshStandardMaterial({ color: 0x7cb342 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const house = new THREE.Group();
scene.add(house);

const W = 6, H = 3, D = 6;

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(W, D),
  new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
house.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf2e6cf, side: THREE.DoubleSide });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd8ef, transparent: true, opacity: 0.6 });

function createWall(width, height, x, y, z, rotY, hasWindow) {
  const wallGroup = new THREE.Group();
  if (!hasWindow) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(width, height, 0.2), wallMat);
    wall.position.set(0, height/2, 0);
    wall.castShadow = true; wall.receiveShadow = true;
    wallGroup.add(wall);
  } else {
    const ww = 2, wh = 1.2;
    const sideW = (width - ww) / 2;
    const left = new THREE.Mesh(new THREE.BoxGeometry(sideW, height, 0.2), wallMat);
    left.position.set(-width/2 + sideW/2, height/2, 0);
    left.castShadow = true; left.receiveShadow = true; wallGroup.add(left);
    const right = new THREE.Mesh(new THREE.BoxGeometry(sideW, height, 0.2), wallMat);
    right.position.set(width/2 - sideW/2, height/2, 0);
    right.castShadow = true; right.receiveShadow = true; wallGroup.add(right);
    const top = new THREE.Mesh(new THREE.BoxGeometry(ww, height - wh - 0.8, 0.2), wallMat);
    top.position.set(0, height - (height - wh - 0.8)/2, 0);
    top.castShadow = true; top.receiveShadow = true; wallGroup.add(top);
    const bottom = new THREE.Mesh(new THREE.BoxGeometry(ww, 0.8, 0.2), wallMat);
    bottom.position.set(0, 0.4, 0);
    bottom.castShadow = true; bottom.receiveShadow = true; wallGroup.add(bottom);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(ww, wh, 0.05), glassMat);
    glass.position.set(0, 1.4, 0);
    wallGroup.add(glass);
  }
  wallGroup.position.set(x, y, z);
  wallGroup.rotation.y = rotY;
  house.add(wallGroup);
}

createWall(W, H, 0, 0, -D/2, 0, false);
createWall(D, H, -W/2, 0, 0, Math.PI/2, true);
createWall(D, H, W/2, 0, 0, Math.PI/2, true);

const frontW = W, frontH = H, doorW = 1.5, doorH = 2.2;
const fLeft = new THREE.Mesh(new THREE.BoxGeometry((frontW-doorW)/2, frontH, 0.2), wallMat);
fLeft.position.set(-frontW/2 + (frontW-doorW)/4, frontH/2, D/2);
fLeft.castShadow = true; fLeft.receiveShadow = true; house.add(fLeft);

const fRight = new THREE.Mesh(new THREE.BoxGeometry((frontW-doorW)/2, frontH, 0.2), wallMat);
fRight.position.set(frontW/2 - (frontW-doorW)/4, frontH/2, D/2);
fRight.castShadow = true; fRight.receiveShadow = true; house.add(fRight);

const fTop = new THREE.Mesh(new THREE.BoxGeometry(doorW, frontH-doorH, 0.2), wallMat);
fTop.position.set(0, frontH - (frontH-doorH)/2, D/2);
fTop.castShadow = true; fTop.receiveShadow = true; house.add(fTop);

const roof = new THREE.Mesh(new THREE.ConeGeometry(W * 0.75, 2, 4), new THREE.MeshStandardMaterial({ color: 0x8d3b2f }));
roof.position.y = H + 1;
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
house.add(roof);

const tableMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
const tableTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.8), tableMat);
tableTop.position.set(-1, 0.8, -1);
tableTop.castShadow = true; house.add(tableTop);
const legGeo = new THREE.BoxGeometry(0.1, 0.8, 0.1);
for(let i=0; i<4; i++){
  const leg = new THREE.Mesh(legGeo, tableMat);
  leg.position.set(-1 + (i<2?0.5:-0.5), 0.4, -1 + (i%2===0?0.3:-0.3));
  house.add(leg);
}

let move = { forward: 0, right: 0 };
let look = { x: 0, y: 0 };
const rotationSpeed = 0.005;

let isLooking = false;
let lastTouchX = 0, lastTouchY = 0;

renderer.domElement.addEventListener('touchstart', (e) => {
  for (let i = 0; i < e.touches.length; i++) {
    if (e.touches[i].clientX > window.innerWidth / 2) {
      isLooking = true;
      lastTouchX = e.touches[i].clientX;
      lastTouchY = e.touches[i].clientY;
    }
  }
});

renderer.domElement.addEventListener('touchmove', (e) => {
  if (isLooking) {
    for (let i = 0; i < e.touches.length; i++) {
      if (e.touches[i].clientX > window.innerWidth / 2) {
        let deltaX = e.touches[i].clientX - lastTouchX;
        let deltaY = e.touches[i].clientY - lastTouchY;
        look.y -= deltaX * rotationSpeed;
        look.x -= deltaY * rotationSpeed;
        look.x = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, look.x));
        lastTouchX = e.touches[i].clientX;
        lastTouchY = e.touches[i].clientY;
      }
    }
  }
});

renderer.domElement.addEventListener('touchend', () => { isLooking = false; });

const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
let joystickActive = false;
let joystickCenter = { x: 0, y: 0 };

joystick.addEventListener('touchstart', (e) => {
  e.preventDefault();
  joystickActive = true;
  const rect = joystick.getBoundingClientRect();
  joystickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
});

joystick.addEventListener('touchmove', (e) => {
  if (!joystickActive) return;
  e.preventDefault();
  const touch = e.touches[0];
  let dx = touch.clientX - joystickCenter.x;
  let dy = touch.clientY - joystickCenter.y;
  const maxDist = 35;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
  move.right = dx / maxDist;
  move.forward = -dy / maxDist;
});

joystick.addEventListener('touchend', () => {
  joystickActive = false;
  stick.style.transform = `translate(0px, 0px)`;
  move.forward = 0;
  move.right = 0;
});

const speed = 3.0;
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const actualSpeed = speed * dt;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = look.y;
  camera.rotation.x = look.x;

  if (move.forward !== 0 || move.right !== 0) {
    let forwardVec = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), look.y);
    let rightVec = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), look.y);
    
    let finalMove = new THREE.Vector3();
    finalMove.addScaledVector(forwardVec, move.forward * actualSpeed);
    finalMove.addScaledVector(rightVec, move.right * actualSpeed);
    
    let newX = camera.position.x + finalMove.x;
    let newZ = camera.position.z + finalMove.z;

    if (Math.abs(newX) < 45) camera.position.x = newX;
    if (Math.abs(newZ) < 45) camera.position.z = newZ;
  }
  renderer.render(scene, camera);
}

look.x = -0.05;
look.y = 0;
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
